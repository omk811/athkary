name: Build full adhkar book
on:
  push:
    paths:
      - 'scripts/build_book.py'
      - '.github/workflows/build-book.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pymupdf Pillow
      - name: Get the same 103-page edition of the source book
        run: |
          curl -fSL --retry 3 -A 'Mozilla/5.0' 'https://www.alarabimag.com/download/book/?b=c3fd7bb26fd0a6173a2257fc72235240' -o source.pdf
          test "$(head -c 4 source.pdf)" = '%PDF'
      - name: Render every original page and index all 247 topics
        run: python scripts/build_book.py
      - name: Commit generated website assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json pages/
          if ! git diff --cached --quiet; then
            git commit -m "Publish full book page images and topic catalog"
            git push origin HEAD:main
          fi
